name: Windows installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tailor-windows-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build, test, and publish the Windows installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-installer.mjs --verify-install --publish
      - name: Build and test without publishing
        if: github.event_name != 'push'
        run: node scripts/build-installer.mjs --verify-install
