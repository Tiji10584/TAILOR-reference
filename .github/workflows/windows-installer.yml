name: Windows installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tailor-windows-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend and Windows icon
        run: npm run build
      - name: Test license verification and Rust commands
        run: cargo test --manifest-path src-tauri/Cargo.toml --release
      - name: Build standalone Windows installer
        run: npm run tauri build
      - name: Verify installer and show SHA-256
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not created.' }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List
      - name: Publish installer to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          gh release view v0.2.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.2.0 "$installer" --clobber
          } else {
            gh release create v0.2.0 "$installer" --target "$env:GITHUB_SHA" --title 'TAILOR 0.2.0' --notes 'Windows installer with offline WebView2 and per-device activation.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the installer.' }
