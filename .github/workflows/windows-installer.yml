name: Windows installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailor-windows-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend and Windows icon
        run: npm run build
      - name: Test license verification and Rust commands
        run: cargo test --manifest-path src-tauri/Cargo.toml --release
      - name: Build standalone Windows installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: TAILOR-0.2.0-Windows-offline-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
